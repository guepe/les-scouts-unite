# Publie une version du thème et de son extension quand un tag vX.Y.Z est poussé : lance les vérifications
# et les tests (verifier.yml), vérifie les versions et le CHANGELOG, construit les deux zips et les attache à la Release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verifier:
    uses: ./.github/workflows/verifier.yml

  zip:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier que le thème et l'extension portent la version du tag
        run: |
          for fichier in style.css extension/les-scouts-unite-extension.php; do
            version=$(sed -n 's/^\( \* \)\{0,1\}Version: *//p' "$fichier" | tr -d '\r')
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::$fichier est en $version, le tag est $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Vérifier que le CHANGELOG date cette version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## $version – [0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md n'a pas de rubrique « ## $version – AAAA-MM-JJ »"
            exit 1
          fi

      - name: Construire les zips (le thème sans la doc, les outils ni l'extension, voir .gitattributes)
        run: |
          git archive --format=zip --prefix=les-scouts-unite/ -o les-scouts-unite.zip "$GITHUB_REF_NAME"
          git archive --format=zip --prefix=les-scouts-unite-extension/ -o les-scouts-unite-extension.zip "$GITHUB_REF_NAME:extension"

      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Notes : la rubrique de cette version dans CHANGELOG.md.
          awk -v v="$version" '/^## /{p = (index($0, "## " v " ") == 1); next} p' CHANGELOG.md > notes.md
          # Les liens relatifs du CHANGELOG (docs/…) mènent au dépôt, à la version publiée.
          sed -i -E "s#\]\(((docs|tests|assets)/[^)]*)\)#](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/\1)#g" notes.md
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" les-scouts-unite.zip les-scouts-unite-extension.zip \
            --title "Les Scouts – Unité $version" --notes-file notes.md $prerelease
